plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

android {
    namespace 'tv.danko.app'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "tv.danko.app"
        minSdk 26
        targetSdk 36
        versionCode 57
        versionName "1.0.6"
        // TV = armeabi-v7a (32 bits! rtd284x con userspace de 32b) +
        // teléfono = arm64-v8a. Sin x86 (emulador). El APK traía 4 ABIs
        // (174MB, installs eternos); con 2 queda en ~95MB.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Firma release (F9): keystore fuera del repo (~/.keystores/ + claves en
    // ~/.gradle/gradle.properties). Sin esas props compila igual sin firmar.
    def ksProps = ["DANKOTV_STORE_FILE", "DANKOTV_STORE_PASSWORD", "DANKOTV_KEY_ALIAS", "DANKOTV_KEY_PASSWORD"]
    if (ksProps.every { project.hasProperty(it) || System.getenv(it) != null }) {
        signingConfigs {
            create("release") {
                storeFile = file(project.property("DANKOTV_STORE_FILE"))
                storePassword = project.property("DANKOTV_STORE_PASSWORD")
                keyAlias = project.property("DANKOTV_KEY_ALIAS")
                keyPassword = project.property("DANKOTV_KEY_PASSWORD")
            }
        }
        buildTypes.release.signingConfig = signingConfigs.getByName("release")
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
    // Nombre de salida con marca: dankotv-1.0.apk (release).
    // (API nueva: applicationVariants ya no existe en AGP 9.)
    def appVer = android.defaultConfig.versionName
    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                def suffix = variant.buildType == "release" ? "" : "-debug"
                output.outputFileName.set("dankotv-${appVer}${suffix}.apk")
            }
        }
    }
    // Room: exporta esquemas (útil para migraciones F6+)
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.activity.compose
    implementation libs.androidx.core.ktx
    // TV (Leanback/D-pad): se usan desde F3, aquí solo se valida resolución
    implementation libs.androidx.tv.foundation
    implementation libs.androidx.tv.material
    // F1 datos: red + base + settings + JSON (JVM-testeable, sin android.*)
    implementation libs.okhttp
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    implementation libs.androidx.datastore.preferences
    implementation libs.kotlinx.coroutines.android
    implementation libs.gson
    implementation libs.coil.compose
    implementation libs.cast.framework
    implementation libs.mediarouter
    // F2 player: libmpv embebido (mismo motor que Linux)
    implementation libs.mpv.android.lib
    // F3 UI: navegación + ViewModels
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    ksp libs.androidx.room.compiler
    testImplementation libs.junit
    testImplementation libs.mockwebserver3
    testImplementation libs.kotlinx.coroutines.test
}
